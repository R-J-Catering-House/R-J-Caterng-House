version: "3.9"

services:
  db:
    image: postgres:15
    container_name: rj_catering_db
    environment:
      POSTGRES_DB: rj_catering
      POSTGRES_USER: rj_user
      POSTGRES_PASSWORD: rj_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rj_catering_backend
    environment:
      DATABASE_URL: postgresql+psycopg://db:5432/rj_catering
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      SMTP_USER: demo@example.com
      SMTP_PASSWORD: demo_password
      SMTP_FROM_EMAIL: no-reply@rjcateringhouse.com
      JWT_SECRET_KEY: change-me
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rj_catering_frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
