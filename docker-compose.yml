services:
  db:
    image: postgres:15
    container_name: rj_catering_db
    environment:
      POSTGRES_DB: rj_catering
      POSTGRES_USER: rj_user
      POSTGRES_PASSWORD: rj_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rj_user -d rj_catering"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rj_catering_backend
    environment:
      DATABASE_URL: postgresql+psycopg://rj_user:rj_password@db:5432/rj_catering
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      SMTP_USER: demo@example.com
      SMTP_PASSWORD: demo_password
      SMTP_FROM_EMAIL: no-reply@rjcateringhouse.com
      JWT_SECRET_KEY: change-me
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rj_catering_frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_WEDDING_PLANNER_PHONE: "50662916883"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
